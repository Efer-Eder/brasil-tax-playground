# /etc/nginx/snippets/brasil-tax-playground.conf — incluído no server efer.online.
# App:  https://efer.online/projeto/brasil-tax-playground/
# API:  https://efer.online/api/brasil-tax-playground/<endpoint>
#       -> app /projeto/brasil-tax-playground/api/<endpoint>
# Upstream: container "app" publicado só em 127.0.0.1:3020.

# Raiz do app. O Next usa a forma SEM barra final (e redireciona a com barra
# para ela), então aqui só encaminhamos — redirecionar criaria um loop.
location = /projeto/brasil-tax-playground {
    limit_req zone=btp_web_ip burst=60 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:3020;
}

# API pública (alias com namespace do projeto, padrão da VPS).
location ^~ /api/brasil-tax-playground/ {
    limit_req zone=btp_api_ip burst=20 nodelay;
    limit_req zone=btp_api_total burst=60 nodelay;
    limit_req_status 429;
    limit_conn btp_conn_ip 10;
    limit_conn_status 429;
    error_page 429 = @btp_429;

    client_max_body_size 512k;
    client_body_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 15s;

    rewrite ^/api/brasil-tax-playground/(.*)$ /projeto/brasil-tax-playground/api/$1 break;
    proxy_pass http://127.0.0.1:3020;
}

# Mesma API pelo caminho do app (usado pela própria interface).
location ^~ /projeto/brasil-tax-playground/api/ {
    limit_req zone=btp_api_ip burst=20 nodelay;
    limit_req zone=btp_api_total burst=60 nodelay;
    limit_req_status 429;
    limit_conn btp_conn_ip 10;
    limit_conn_status 429;
    error_page 429 = @btp_429;

    client_max_body_size 512k;
    client_body_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:3020;
}

# Páginas e assets.
location ^~ /projeto/brasil-tax-playground/ {
    limit_req zone=btp_web_ip burst=60 nodelay;
    limit_req_status 429;
    limit_conn btp_conn_ip 20;

    client_max_body_size 64k;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:3020;
}

location @btp_429 {
    default_type application/json;
    add_header Retry-After 2 always;
    add_header Access-Control-Allow-Origin * always;
    return 429 '{"ok":false,"httpStatus":429,"erro":{"tipo":"rate-limit","mensagem":"Muitas requisições. Limite: 2 por segundo por cliente (rajada de 20). Tente de novo em alguns segundos."}}';
}
