# /etc/nginx/conf.d/brasil-tax-playground.conf — contexto http.
# Zonas de rate limit do Brasil Tax Playground. Ver docs/deploy-efer-online.md.

# O site fica atrás do Cloudflare e o Nginx não usa real_ip: $remote_addr é o
# IP do Cloudflare. A chave por cliente usa CF-Connecting-IP; sem ele (acesso
# direto à origem), cai no $remote_addr. A zona global segura o total mesmo
# que alguém forje o cabeçalho.
map $http_cf_connecting_ip $btp_cliente {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# API de simulação: 2 req/s por cliente (burst 20) e 30 req/s no total
# (capacidade medida na VPS: ~30 req/s com 1 item por operação).
limit_req_zone $btp_cliente zone=btp_api_ip:10m rate=2r/s;
limit_req_zone $server_name zone=btp_api_total:1m rate=30r/s;

# Páginas e assets: 10 req/s por cliente (burst 60).
limit_req_zone $btp_cliente zone=btp_web_ip:10m rate=10r/s;

# Conexões simultâneas por cliente.
limit_conn_zone $btp_cliente zone=btp_conn_ip:10m;
