# /etc/nginx/conf.d/brasil-tax-playground.conf — contexto http.
# Zonas de rate limit do Brasil Tax Playground. Ver docs/deploy-efer-online.md.
# Tudo prefixado com "btp_" para não colidir com outras configurações.

# O site fica atrás do Cloudflare e o Nginx não usa real_ip: $remote_addr é o
# IP do Cloudflare. Só confiamos em CF-Connecting-IP quando a conexão vem de
# uma faixa oficial do Cloudflare (https://www.cloudflare.com/ips/, lida em
# 2026-11-20); fora delas, o cabeçalho é ignorado para não permitir que alguém
# o falsifique acessando a origem diretamente.
geo $btp_de_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map $btp_de_cloudflare $btp_cf_ip {
    1       $http_cf_connecting_ip;
    default "";
}

map $btp_cf_ip $btp_cliente {
    ""      $remote_addr;
    default $btp_cf_ip;
}

# API de simulação: 2 req/s por cliente (burst 20) e 30 req/s no total
# (capacidade medida na VPS: ~30 req/s com 1 item por operação).
limit_req_zone $btp_cliente zone=btp_api_ip:10m rate=2r/s;
limit_req_zone $server_name zone=btp_api_total:1m rate=30r/s;

# Páginas e assets: 10 req/s por cliente (burst 60).
limit_req_zone $btp_cliente zone=btp_web_ip:10m rate=10r/s;

# Conexões simultâneas por cliente.
limit_conn_zone $btp_cliente zone=btp_conn_ip:10m;
